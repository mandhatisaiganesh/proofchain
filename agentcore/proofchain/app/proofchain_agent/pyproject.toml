[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "proofchain_agent"
version = "0.1.0"
description = "ProofChain AgentCore Runtime Application using Strands SDK"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "aws-opentelemetry-distro",
    "bedrock-agentcore >= 1.9.1",
    "botocore[crt] >= 1.35.0",
    "mcp ~= 1.24.0",
    "strands-agents >= 1.15.0",
    "pydantic >= 2.0.0",
    "networkx >= 3.0",
]

[tool.hatch.build.targets.wheel]
packages = ["."]
