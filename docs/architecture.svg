<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 850" width="1100" height="850" style="background:#090d16; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#4338ca" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="warnGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="awsGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff9900" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Title Header -->
  <text x="550" y="45" text-anchor="middle" fill="#f8fafc" font-size="24" font-weight="700" letter-spacing="1">PROOFCHAIN SYSTEM ARCHITECTURE</text>
  <text x="550" y="70" text-anchor="middle" fill="#94a3b8" font-size="14">Evidence-Grounded Commitment Intelligence Platform on AWS &amp; Amazon Bedrock</text>

  <!-- User / Client Layer -->
  <rect x="50" y="100" width="1000" height="95" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" filter="url(#shadow)" />
  <text x="75" y="125" fill="#38bdf8" font-size="12" font-weight="700" letter-spacing="1">1. PRESENTATION LAYER (REACT 18 + TYPESCRIPT + VITE)</text>
  
  <rect x="75" y="140" width="210" height="42" rx="6" fill="#1e293b" stroke="#475569" />
  <text x="180" y="165" text-anchor="middle" fill="#f1f5f9" font-size="12" font-weight="600">Executive Dashboard</text>

  <rect x="305" y="140" width="220" height="42" rx="6" fill="#1e293b" stroke="#475569" />
  <text x="415" y="165" text-anchor="middle" fill="#f1f5f9" font-size="12" font-weight="600">Bipartite Commitment Graph</text>

  <rect x="545" y="140" width="230" height="42" rx="6" fill="#1e293b" stroke="#475569" />
  <text x="660" y="165" text-anchor="middle" fill="#f1f5f9" font-size="12" font-weight="600">Cross-Doc Conflict Inspector</text>

  <rect x="795" y="140" width="230" height="42" rx="6" fill="#1e293b" stroke="#6366f1" />
  <text x="910" y="165" text-anchor="middle" fill="#818cf8" font-size="12" font-weight="600">Human-in-the-Loop Center</text>

  <!-- Connector Arrow -->
  <line x1="550" y1="195" x2="550" y2="230" stroke="#6366f1" stroke-width="2.5" stroke-dasharray="4 4"/>
  <polygon points="545,225 550,235 555,225" fill="#6366f1" />

  <!-- API Gateway Layer -->
  <rect x="50" y="235" width="1000" height="85" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" filter="url(#shadow)" />
  <text x="75" y="260" fill="#a855f7" font-size="12" font-weight="700" letter-spacing="1">2. BACKEND API GATEWAY (FASTAPI + PYDANTIC V2)</text>
  
  <rect x="75" y="275" width="210" height="35" rx="6" fill="#1e293b" stroke="#475569" />
  <text x="180" y="297" text-anchor="middle" fill="#cbd5e1" font-size="11">Workspaces &amp; Ingestion API</text>

  <rect x="305" y="275" width="220" height="35" rx="6" fill="#1e293b" stroke="#475569" />
  <text x="415" y="297" text-anchor="middle" fill="#cbd5e1" font-size="11">Commitments &amp; Graph API</text>

  <rect x="545" y="275" width="230" height="35" rx="6" fill="#1e293b" stroke="#475569" />
  <text x="660" y="297" text-anchor="middle" fill="#cbd5e1" font-size="11">Conflicts &amp; Risk API</text>

  <rect x="795" y="275" width="230" height="35" rx="6" fill="#1e293b" stroke="#475569" />
  <text x="910" y="297" text-anchor="middle" fill="#cbd5e1" font-size="11">Actions Approval &amp; Scenarios</text>

  <!-- Connector Arrow -->
  <line x1="550" y1="320" x2="550" y2="355" stroke="#6366f1" stroke-width="2.5" stroke-dasharray="4 4"/>
  <polygon points="545,350 550,360 555,350" fill="#6366f1" />

