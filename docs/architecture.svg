  <text x="177" y="650" text-anchor="middle" fill="#bae6fd" font-size="11" font-weight="600">Commitment Nodes (Vc)</text>
  <text x="177" y="663" text-anchor="middle" fill="#7dd3fc" font-size="9">SLAs, Warranties, Obligations</text>

  <rect x="300" y="630" width="210" height="42" rx="6" fill="#0f172a" stroke="#059669" />
  <text x="405" y="650" text-anchor="middle" fill="#a7f3d0" font-size="11" font-weight="600">Evidence Nodes (Ve)</text>
  <text x="405" y="663" text-anchor="middle" fill="#6ee7b7" font-size="9">Architectures, Audits, Policies</text>

  <rect x="75" y="685" width="435" height="40" rx="6" fill="#1e293b" stroke="#334155" />
  <text x="292" y="705" text-anchor="middle" fill="#e2e8f0" font-size="11" font-weight="600">Sub-5ms Invalidation Cascade Engine (BFS Directed Traversal)</text>
  <text x="292" y="718" text-anchor="middle" fill="#94a3b8" font-size="9">Dynamically propagates failure states from evidence to dependent commitments</text>

  <!-- AWS Cloud Services -->
  <rect x="560" y="590" width="490" height="150" rx="10" fill="url(#cardGrad)" stroke="#ea580c" stroke-width="1.5" filter="url(#shadow)" />
  <text x="585" y="615" fill="#fb923c" font-size="12" font-weight="700" letter-spacing="1">5. AWS SERVERLESS CLOUD INFRASTRUCTURE</text>
  
  <rect x="585" y="630" width="215" height="42" rx="6" fill="#0f172a" stroke="#c2410c" />
  <text x="692" y="650" text-anchor="middle" fill="#fed7aa" font-size="11" font-weight="600">Amazon S3 Document Vault</text>
  <text x="692" y="663" text-anchor="middle" fill="#fdba74" font-size="9">AES-256 Encrypted &amp; Private</text>

  <rect x="815" y="630" width="215" height="42" rx="6" fill="#0f172a" stroke="#c2410c" />
  <text x="922" y="650" text-anchor="middle" fill="#fed7aa" font-size="11" font-weight="600">Amazon DynamoDB State Store</text>
  <text x="922" y="663" text-anchor="middle" fill="#fdba74" font-size="9">Single-Table Pay-Per-Request</text>

  <rect x="585" y="685" width="215" height="40" rx="6" fill="#0f172a" stroke="#4f46e5" />
  <text x="692" y="705" text-anchor="middle" fill="#c7d2fe" font-size="11" font-weight="600">Amazon Bedrock Models</text>
  <text x="692" y="718" text-anchor="middle" fill="#a5b4fc" font-size="9">Claude 3.5 Sonnet / Haiku</text>

  <rect x="815" y="685" width="215" height="40" rx="6" fill="#0f172a" stroke="#059669" />
  <text x="922" y="705" text-anchor="middle" fill="#a7f3d0" font-size="11" font-weight="600">CloudWatch Observability</text>
  <text x="922" y="718" text-anchor="middle" fill="#6ee7b7" font-size="9">Latency, Invocations, Traces</text>

  <!-- Footer Guarantees -->
  <rect x="50" y="760" width="1000" height="60" rx="8" fill="#0b1120" stroke="#1e293b" />
  <text x="550" y="785" text-anchor="middle" fill="#38bdf8" font-size="11" font-weight="600">CORE GUARANTEES: 100% Deterministic Provenance • Zero Hallucinations • Sub-Second Cascade • Human-in-the-Loop Authorization</text>
  <text x="550" y="805" text-anchor="middle" fill="#64748b" font-size="10">Built for AWS Agents for Humans Hackathon • Track: Professional Agents</text>
</svg>
