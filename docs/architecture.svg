  <rect x="50" y="360" width="1000" height="190" rx="10" fill="url(#cardGrad)" stroke="#4f46e5" stroke-width="2" filter="url(#shadow)" />
  <text x="75" y="385" fill="#818cf8" font-size="12" font-weight="700" letter-spacing="1">3. STRANDS MULTI-AGENT CLUSTER (AMAZON BEDROCK AGENTCORE)</text>
  
  <rect x="75" y="405" width="950" height="36" rx="6" fill="url(#primaryGrad)" />
  <text x="550" y="428" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">Orchestrator Agent (DAG Lifecycle &amp; Scratchpad Coordinator)</text>

  <!-- Specialist Agents Grid -->
  <rect x="75" y="455" width="220" height="40" rx="6" fill="#0f172a" stroke="#334155" />
  <text x="185" y="480" text-anchor="middle" fill="#f8fafc" font-size="11">📋 Requirement Strand</text>

  <rect x="315" y="455" width="220" height="40" rx="6" fill="#0f172a" stroke="#334155" />
  <text x="425" y="480" text-anchor="middle" fill="#f8fafc" font-size="11">🤝 Commitment Strand</text>

  <rect x="555" y="455" width="220" height="40" rx="6" fill="#0f172a" stroke="#334155" />
  <text x="665" y="480" text-anchor="middle" fill="#f8fafc" font-size="11">🔍 Evidence Verifier Strand</text>

  <rect x="795" y="455" width="230" height="40" rx="6" fill="#0f172a" stroke="#ef4444" stroke-width="1.5" />
  <text x="910" y="480" text-anchor="middle" fill="#fca5a5" font-size="11">⚡ Conflict &amp; Contradiction</text>

  <rect x="75" y="505" width="220" height="35" rx="6" fill="#0f172a" stroke="#334155" />
  <text x="185" y="527" text-anchor="middle" fill="#94a3b8" font-size="11">⚙️ Capability Analyzer</text>

  <rect x="315" y="505" width="220" height="35" rx="6" fill="#0f172a" stroke="#334155" />
  <text x="425" y="527" text-anchor="middle" fill="#94a3b8" font-size="11">⚠️ Quantitative Risk Strand</text>

  <rect x="555" y="505" width="220" height="35" rx="6" fill="#0f172a" stroke="#334155" />
  <text x="665" y="527" text-anchor="middle" fill="#94a3b8" font-size="11">🛠️ Remediation Action Strand</text>

  <rect x="795" y="505" width="230" height="35" rx="6" fill="#0f172a" stroke="#334155" />
  <text x="910" y="527" text-anchor="middle" fill="#94a3b8" font-size="11">🔄 Invalidation Cascade Engine</text>

  <!-- Connectors from Agents to Core & AWS -->
  <line x1="250" y1="550" x2="250" y2="585" stroke="#38bdf8" stroke-width="2" />
  <line x1="550" y1="550" x2="550" y2="585" stroke="#a855f7" stroke-width="2" />
  <line x1="850" y1="550" x2="850" y2="585" stroke="#ff9900" stroke-width="2" />

