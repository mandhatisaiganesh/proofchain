  <rect x="50" y="590" width="480" height="150" rx="10" fill="url(#cardGrad)" stroke="#0284c7" stroke-width="1.5" filter="url(#shadow)" />
  <text x="75" y="615" fill="#38bdf8" font-size="12" font-weight="700" letter-spacing="1">4. COMMITMENT INTELLIGENCE &amp; GRAPH CORE</text>
  
